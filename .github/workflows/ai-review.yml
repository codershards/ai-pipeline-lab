name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt
          echo "lines=$(wc -l < diff.txt)" >> $GITHUB_OUTPUT

      - name: AI Code Review
        if: steps.diff.outputs.lines != '0'
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DIFF_FILE: diff.txt
        with:
          script: |
            const fs = require("fs");
            const diff = fs.readFileSync("diff.txt", "utf8").slice(0, 8000);

            const prompt = `You are a security-focused code reviewer.
            Review this git diff for security issues. Focus on:
            - SQL injection
            - Command injection
            - Hardcoded credentials
            - Debug mode in production
            - Missing input validation

            For each issue, output: SEVERITY, FILE:LINE, ISSUE, FIX.
            If no issues found, output: "No security issues found."

            DIFF:
            ${diff}`;

            const response = await fetch(
              "https://api.openai.com/v1/chat/completions",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Bearer ${process.env.OPENAI_API_KEY}`
                },
                body: JSON.stringify({
                  model: "gpt-5-mini",  // any current mini-class model
                  messages: [{ role: "user", content: prompt }],
                  temperature: 0
                })
              }
            );

            const data = await response.json();
            const review = data.choices[0].message.content;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## AI Code Review\n\n${review}\n\n---\n*Review by AI (mini-class model). This is an automated AI review.*`
            });
